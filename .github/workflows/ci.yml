name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable so a release can re-run this exact gate on the tagged commit. Tags do not match the
  # push filter above, so without this a tag would deploy to prod having proven nothing
  # (docs/pipeline.md §5).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and its name are both `gate` on purpose: that string is the check context branch
  # protection requires on `main`. Slice 1.1 required `gate` and `evals` with no workflow behind
  # either, which is not a pending check — it is a permanently failing one, and the only way past it
  # was `--admin`. Slice 1.6 re-armed `gate` only after it had reported green once, and slice 1.8
  # does the same for `evals` below — after watching it go red, not only green.
  gate:
    name: gate
    runs-on: ubuntu-latest

    services:
      # The same image as docker-compose.yml, so CI and local run one engine — and pgvector rather
      # than stock postgres because 0001_init.sql creates the `vector` extension.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dona
          POSTGRES_USER: dona
          POSTGRES_PASSWORD: dona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dona -d dona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dona:dona@127.0.0.1:5432/dona
      # Without this the kernel durability suite skips itself and the job passes having touched no
      # database at all — 23 cases, not 2, since slice 1.4 (src/kernel/pg-support.ts).
      REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The two grep guards (docs/pipeline.md §6). A step of `gate` rather than a job of their own,
      # because `gate` is the required context on `main` and a guard nothing requires is a guard
      # nobody obeys. Both fail when they scanned zero files.
      - run: npm run guards
      # `npm test` is test:code && test:hooks. The hooks half is the only thing that runs
      # .claude/hooks/hooks.test.mjs, so a gate that shortcuts to test:code drops those cases and
      # stops proving the guardrails work.
      - run: npm test

  # The agent's gate (docs/pipeline.md §7), and the second required context on `main` from slice
  # 1.8. A job of its own rather than a step of `gate` for one reason: it is the only thing in this
  # repository that calls a paid third party, so what it needs, what it costs and what it can be
  # blamed for all stay separable from typecheck and lint.
  #
  # It does not repeat the two grep guards. They are steps of `gate` (slice 1.7).
  evals:
    name: evals
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dona
          POSTGRES_USER: dona
          POSTGRES_PASSWORD: dona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dona -d dona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dona:dona@127.0.0.1:5432/dona
      # Both halves of what a retrieval case needs, and both are the same argument: absent a
      # database or a key those cases *skip*, which is right on a clean clone and a lie here — the
      # job would go green having ranked nothing. `=1` turns each skip back into a failure
      # (src/kernel/pg-support.ts, evals/run.ts).
      REQUIRE_POSTGRES: '1'
      REQUIRE_EMBEDDINGS: '1'
      # A CI-only key, deliberately not staging's or prod's: those live in Secret Manager and reach
      # only their own service account, so this one can be revoked on its own without touching a
      # deployed environment (docs/pipeline.md §4, ADR-0003).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run evals
      # TEMPORARY, and reverted in this same PR. The ranking ratchet is set to the rank retrieval
      # achieves *today* (docs/pipeline.md §7), and the only place a real embedder exists is this
      # job — there is no key on a laptop. This prints the measurement once so 002's rankAtMost is a
      # number that was measured rather than guessed; the table goes into tasks/evidence/1.8.md and
      # the step comes back out, because an instrument that runs on every PR is not an instrument.
      - run: npm run measure
