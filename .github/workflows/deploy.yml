name: Deploy

# Runs only after CI reports success, so a red commit can never reach staging — which covers a
# direct push to `main` as well as a merge, because the trigger is the CI *result* and not the push
# (docs/pipeline.md §5). This wiring is the whole acceptance criterion of slice 1.6.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    env:
      PROJECT: dona-v5
      REGION: me-west1
      SERVICE: dona-staging
      PORTAL: dona-staging-portal
      IMAGE: me-west1-docker.pkg.dev/dona-v5/dona/app
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run hands us the default-branch tip by default; deploy the commit that actually
          # passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}

      # No service-account key exists to leak: the provider's attribute condition pins this to
      # RandomWilder/dona-v5, so no other repository can mint a token for this project (slice 1.5).
      # If the repository ever moves, this path and that condition change together.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/681282581055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: deploy-staging@dona-v5.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:staging" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:staging"
          docker image inspect "$IMAGE:$SHA" --format 'image size: {{.Size}} bytes'

      # Migrations run before the new revision serves, from the image about to be deployed, as the
      # *runtime* service account — not from this runner (docs/pipeline.md §5, slice 1.6).
      #
      # Two reasons, and the second decided it. Migrations are append-only, so old code against the
      # new schema is the safe direction and new code against the old schema is not. And
      # staging-database-url is a unix-socket URL readable only by app-staging: migrating from the
      # runner would mean granting the deploy identity access to the database URL and connecting
      # from outside the perimeter, which trades a real isolation property for a build step. The
      # runner orchestrates; it never holds the credential.
      #
      # --max-retries 0 so a bad migration fails once and fails the deploy, rather than being
      # retried three times against a database it has already half-changed.
      - name: Migrate
        run: |
          gcloud run jobs deploy "$SERVICE-migrate" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-staging@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$PROJECT:$REGION:dona-staging" \
            --set-secrets "DATABASE_URL=staging-database-url:latest" \
            --command node \
            --args src/migrate.ts \
            --max-retries 0 \
            --task-timeout 10m \
            --execute-now \
            --wait \
            --quiet

      - name: Document AI processor
        id: ocr
        run: |
          ID="$(./infra/ocr-processor-id.sh staging || true)"
          echo "processor=$ID" >> "$GITHUB_OUTPUT"
          if [[ -z "$ID" ]]; then
            echo "no dona-ocr-staging processor — OCR boots unconfigured" >&2
          else
            echo "DOCUMENT_AI_PROCESSOR=$ID"
          fi

      - name: Deploy
        run: |
          # Google matches the OAuth redirect URI character for character, so the revision is told
          # its own origin rather than deriving one from a proxy header (slice 5.1b).
          BASE_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)' 2>/dev/null || true)"
          ENV_VARS="VERSION=${SHA:0:7},DOCS_BUCKET=$PROJECT-staging-docs,GOOGLE_CLOUD_PROJECT=$PROJECT,DOCUMENT_AI_LOCATION=eu"
          if [[ -n "$BASE_URL" ]]; then
            ENV_VARS="$ENV_VARS,STAFF_BASE_URL=$BASE_URL"
          fi
          if [[ -n "${{ steps.ocr.outputs.processor }}" ]]; then
            ENV_VARS="$ENV_VARS,DOCUMENT_AI_PROCESSOR=${{ steps.ocr.outputs.processor }}"
          fi
          # HTTP/1 stops a body at 32 MiB, under the 100 MB upload bound. HTTP/2 removes that
          # cap; 2Gi is room for one such scan while it is sliced. The process speaks h2c only
          # when K_SERVICE is set. Both flags have to stay, or the next revision is the English page.
          # Outlook (#188) and WhatsApp (#193) mount only the secrets that exist,
          # so a staging deploy before the director has created them still rolls.
          # Each adapter stays unconfigured until every value it needs is present.
          # The Outlook secret's expiry date (#198) is optional: without it the
          # calls list warns that the expiry is unknown.
          SECRETS="DATABASE_URL=staging-database-url:latest,OPENAI_API_KEY=staging-openai-api-key:latest,GOOGLE_OAUTH_CLIENT_ID=staging-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=staging-google-oauth-client-secret:latest"
          add_secret() {
            local env_name="$1" secret_name="$2"
            if gcloud secrets describe "$secret_name" --project "$PROJECT" >/dev/null 2>&1; then
              SECRETS="$SECRETS,${env_name}=${secret_name}:latest"
            else
              echo "$secret_name is missing — not mounted" >&2
            fi
          }
          add_secret GRAPH_TENANT_ID staging-graph-tenant-id
          add_secret GRAPH_CLIENT_ID staging-graph-client-id
          add_secret GRAPH_CLIENT_SECRET staging-graph-client-secret
          add_secret GRAPH_MAILBOX staging-graph-mailbox
          add_secret GRAPH_SECRET_EXPIRES staging-graph-secret-expires
          add_secret WHATSAPP_APP_SECRET staging-whatsapp-app-secret
          add_secret WHATSAPP_VERIFY_TOKEN staging-whatsapp-verify-token
          add_secret WHATSAPP_ACCESS_TOKEN staging-whatsapp-access-token
          add_secret WHATSAPP_PHONE_NUMBER_ID staging-whatsapp-phone-number-id
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-staging@$PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$PROJECT:$REGION:dona-staging" \
            --set-secrets "$SECRETS" \
            --update-env-vars "$ENV_VARS" \
            --allow-unauthenticated \
            --use-http2 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      # The portal service, same image, same database (ADR-0020, #293). The office
      # above is unchanged and keeps the default tenant host, so both of its
      # run.app names stay the office.
      #
      # Tenant host. Before this service exists it has no address list, so the host
      # is the fixed form Cloud Run always assigns:
      # dona-staging-portal-<project number>.me-west1.run.app. Once it exists, the
      # host is every hostname the service reports (run.googleapis.com/urls, plus
      # the status URL), with no scheme and no path. The second deploy is what adds
      # the hashed name. An empty list would fall through to tenant.localhost and
      # the service would answer as the office, so a parse that finds nothing
      # refuses the deploy. A lookup error does too: replacing the list with the
      # fixed form would drop a hostname the portal already serves.
      #
      # No Google sign-in, Outlook, WhatsApp or InforU values. Outlook and WhatsApp
      # are one poller per mailbox: a second service holding the same mailbox would
      # poll it twice. This service does not sign staff in. InforU is mounted, all
      # three values together, in a later review. Secrets and env vars are replaced
      # in full each deploy, so a value that does not belong cannot linger.
      #
      # Max 1 instance. The pool maximum is 5. The office may run 3, so the budget
      # is 3 × 5 plus 1 × 5, which leaves room on the staging database for the
      # migration and the sweep. HTTP/2 and 2Gi are the same upload bound as the
      # office. No migration job and no scheduled job: both stay on the office, so
      # each sweep runs once.
      - name: Deploy portal
        id: portal
        run: |
          # Stderr stays off the JSON. A lookup that fails for any reason other
          # than "no such service" must not deploy: --set-env-vars replaces the
          # list, and a fallback host would drop a hostname the portal already serves.
          PORTAL_ERR="$(mktemp)"
          if PORTAL_JSON="$(gcloud run services describe "$PORTAL" \
            --region "$REGION" --project "$PROJECT" --format=json 2>"$PORTAL_ERR")"; then
            TENANT_HOST="$(printf '%s' "$PORTAL_JSON" | node -e '
              const fs = require("fs");
              const doc = JSON.parse(fs.readFileSync(0, "utf8"));
              const ann = (doc.metadata && doc.metadata.annotations) || {};
              const raw = ann["run.googleapis.com/urls"] || "";
              const candidates = [];
              if (raw.trim().startsWith("[")) candidates.push(...JSON.parse(raw));
              else if (raw.trim()) candidates.push(...raw.split(","));
              const status = doc.status || {};
              if (status.url) candidates.push(status.url);
              const seen = [];
              for (const item of candidates) {
                let host = "";
                try { host = new URL(String(item).trim()).hostname || ""; }
                catch { host = ""; }
                host = host.toLowerCase();
                if (host && !seen.includes(host)) seen.push(host);
              }
              process.stdout.write(seen.join(","));
            ')"
            if [[ -z "$TENANT_HOST" ]]; then
              echo "portal reported no hostnames — refusing to deploy" >&2
              rm -f "$PORTAL_ERR"
              exit 1
            fi
            echo "portal tenant host $TENANT_HOST"
          else
            PORTAL_DESC="$(cat "$PORTAL_ERR")"
            if [[ "$PORTAL_DESC" == *"Cannot find service"* || "$PORTAL_DESC" == *"NOT_FOUND"* ]]; then
              NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
              TENANT_HOST="${PORTAL}-${NUMBER}.${REGION}.run.app"
              echo "portal service does not exist yet — tenant host $TENANT_HOST"
            else
              echo "$PORTAL_DESC" >&2
              rm -f "$PORTAL_ERR"
              exit 1
            fi
          fi
          rm -f "$PORTAL_ERR"
          echo "hosts=$TENANT_HOST" >> "$GITHUB_OUTPUT"
          # A comma separates env vars for gcloud, and the tenant host is itself a
          # comma-separated list, so the delimiter here is a pipe.
          ENV_VARS="VERSION=${SHA:0:7}|DOCS_BUCKET=$PROJECT-staging-docs|GOOGLE_CLOUD_PROJECT=$PROJECT|DOCUMENT_AI_LOCATION=eu|DATABASE_POOL_MAX=5|TENANT_HOST=${TENANT_HOST}"
          if [[ -n "${{ steps.ocr.outputs.processor }}" ]]; then
            ENV_VARS="$ENV_VARS|DOCUMENT_AI_PROCESSOR=${{ steps.ocr.outputs.processor }}"
          fi
          gcloud run deploy "$PORTAL" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-staging@$PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$PROJECT:$REGION:dona-staging" \
            --set-secrets "DATABASE_URL=staging-database-url:latest,OPENAI_API_KEY=staging-openai-api-key:latest" \
            --set-env-vars "^|^${ENV_VARS}" \
            --allow-unauthenticated \
            --use-http2 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      # A rollback pins traffic to a named revision and it stays pinned — the deploy above would
      # then create a revision serving 0%: green pipeline, nothing changed (docs/pipeline.md §5).
      # Both services, or the next merge would unpin only the office.
      - name: Take traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-latest --region "$REGION" --project "$PROJECT" --quiet
          gcloud run services update-traffic "$PORTAL" \
            --to-latest --region "$REGION" --project "$PROJECT" --quiet

      # "Deployed but silently broken" must fail loudly. The same script prod uses and the same one
      # you can run by hand: /health returning ok:true *and* db:up (infra/smoke.sh). The portal also
      # requires the web app manifest, which only the tenant audience serves.
      #
      # Smoke the hosts this deploy configured, every one of them. The service's
      # primary address can be the hashed name, and on the first deploy that name
      # is not a tenant host yet — smoking it would fail a good revision. The next
      # deploy puts both names in the list, and both are smoked.
      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          BODY="$(./infra/smoke.sh "$URL")"
          REVISION="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')"
          PORTAL_REVISION="$(gcloud run services describe "$PORTAL" --region "$REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')"
          HOSTS="${{ steps.portal.outputs.hosts }}"
          if [[ -z "$HOSTS" ]]; then
            echo "portal smoke has no hosts" >&2
            exit 1
          fi
          {
            echo "### Staging deployed"
            echo ""
            echo "- commit: \`$SHA\`"
            echo "- office: $URL"
            echo "- office revision: \`$REVISION\`"
            echo "- office health: \`$BODY\`"
            echo "- portal revision: \`$PORTAL_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for host in ${HOSTS//,/ }; do
            LINE="$(./infra/smoke.sh --portal "https://${host}")"
            {
              echo "- portal: https://${host}"
              echo "- portal health: \`$LINE\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # #192. Filtered messages older than 6 months. Once a day, 04:00 Israel,
      # as the runtime account against the staging database. The job is
      # idempotent, so a deploy that recreates it deletes nothing by itself.
      # Office only: the portal gets no scheduled job, so the sweep runs once.
      # Prod is not scheduled here: production connection is a later ticket.
      - name: Schedule filtered-message sweep
        run: |
          JOB="$SERVICE-filtered-sweep"
          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-staging@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$PROJECT:$REGION:dona-staging" \
            --set-secrets "DATABASE_URL=staging-database-url:latest" \
            --command node \
            --args src/filtered-sweep.ts \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs add-iam-policy-binding "$JOB" \
            --region "$REGION" \
            --project "$PROJECT" \
            --member "serviceAccount:app-staging@$PROJECT.iam.gserviceaccount.com" \
            --role roles/run.invoker \
            --quiet
          URI="https://run.googleapis.com/v2/projects/$PROJECT/locations/$REGION/jobs/$JOB:run"
          COMMON=(
            --location "$REGION"
            --project "$PROJECT"
            --schedule "0 4 * * *"
            --time-zone "Asia/Jerusalem"
            --uri "$URI"
            --http-method POST
            --oauth-service-account-email "app-staging@$PROJECT.iam.gserviceaccount.com"
            --attempt-deadline 30s
            --max-retry-attempts 0
            --quiet
          )
          if gcloud scheduler jobs describe "$JOB" \
            --location "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB" "${COMMON[@]}"
          else
            gcloud scheduler jobs create http "$JOB" "${COMMON[@]}"
          fi
