name: Release

# Prod deploys on a version tag, and only on a version tag. The tag is the deliberate act; nothing
# reaches production by merging (docs/pipeline.md §5).
#
# Written at slice 1.6 and deliberately not exercised here: slice 1.10 cuts v0.1.0, deploys prod,
# rolls it back with infra/rollback.sh and confirms the next deploy still takes traffic — on the one
# week nothing depends on prod. Prod tagging proper starts at week 12 (§8).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Tags do not trigger CI's own push filter, so the gate is re-run here against the tagged commit:
  # typecheck, lint, and the full suite against a real Postgres. Never release red.
  gate:
    uses: ./.github/workflows/ci.yml
    # The gate is two jobs from slice 1.8, and the second one needs OPENAI_API_KEY. A called
    # workflow inherits no secrets by default, so without this line every release would fail its own
    # evals job on a key it was never handed — and the first release is slice 1.10's.
    secrets: inherit

  prod:
    name: prod
    runs-on: ubuntu-latest
    needs: gate
    environment: production

    env:
      PROJECT: dona-v5
      REGION: me-west1
      SERVICE: dona-prod
      IMAGE: me-west1-docker.pkg.dev/dona-v5/dona/app
      SHA: ${{ github.sha }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can be cut from any branch. Production ships main.
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$TAG ($SHA) is not an ancestor of origin/main — refusing to release"
            exit 1
          fi
          echo "$TAG is on main"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/681282581055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: deploy-prod@dona-v5.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:$TAG" -t "$IMAGE:prod" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:prod"

      # Before the revision serves, as the runtime account, from the image being released — the
      # reasoning is in deploy.yml and in docs/pipeline.md §5. On prod the isolation argument is not
      # hypothetical: prod-database-url is the one secret in this project that must never be
      # readable from a CI runner.
      - name: Migrate
        run: |
          gcloud run jobs deploy "$SERVICE-migrate" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-prod@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$PROJECT:$REGION:dona-prod" \
            --set-secrets "DATABASE_URL=prod-database-url:latest" \
            --command node \
            --args src/migrate.ts \
            --max-retries 0 \
            --task-timeout 10m \
            --execute-now \
            --wait \
            --quiet

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "app-prod@$PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$PROJECT:$REGION:dona-prod" \
            --set-secrets "DATABASE_URL=prod-database-url:latest" \
            --update-env-vars "VERSION=$TAG,DOCS_BUCKET=$PROJECT-prod-docs" \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 5 \
            --quiet

      # A rollback pins traffic to an older revision. Without this the next release would create a
      # revision serving 0% — a deploy that looks green and changes nothing.
      - name: Take traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-latest --region "$REGION" --project "$PROJECT" --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          BODY="$(./infra/smoke.sh "$URL")"
          REVISION="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')"
          {
            echo "### Prod released: $TAG"
            echo ""
            echo "- URL: $URL"
            echo "- commit: \`$SHA\`"
            echo "- revision: \`$REVISION\`"
            echo "- health: \`$BODY\`"
            echo ""
            echo "Rollback: \`./infra/rollback.sh prod\`"
          } >> "$GITHUB_STEP_SUMMARY"
